# Demo SQL Server standing in for the company database.
# Swap the .env connection settings to point the MCP server at the real one.
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: company-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 12

volumes:
  mssql-data:
